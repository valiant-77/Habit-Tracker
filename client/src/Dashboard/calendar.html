<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Calendar - HabitTracker</title>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        html.dark { color-scheme: dark; }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .content-wrapper {
            flex: 1 0 auto;
        }
        
        footer {
            flex-shrink: 0;
        }
        
        
        .tasks-container {
            max-height: 360px; 
            overflow-y: auto;
            scrollbar-width: thin;
        }

        #appSidebar { top: 4rem; width: 15rem; transition: width 0.2s ease, transform 0.2s ease; }
        #appSidebar.collapsed { width: 4.5rem; }
        #appSidebar.collapsed .sidebar-label { display: none; }
        #appSidebar.collapsed .sidebar-link { justify-content: center; padding-left: 0.5rem; padding-right: 0.5rem; }
        #sidebarEdgeIcon { transition: transform 0.2s ease; }
        #appSidebar.collapsed #sidebarEdgeIcon { transform: rotate(180deg); }
        #appMain, #appFooter { transition: margin-left 0.2s ease; }
        @media (min-width: 768px) {
            #appMain, #appFooter { margin-left: 15rem; }
            #appMain.rail, #appFooter.rail { margin-left: 4.5rem; }
        }
        @media (max-width: 767px) {
            #appSidebar, #appSidebar.collapsed { width: 15rem; }
            #appHeader {
                height: calc(3rem + env(safe-area-inset-top, 0px));
                padding-top: env(safe-area-inset-top, 0px);
                box-sizing: border-box;
            }
            #appSidebar {
                top: calc(3rem + env(safe-area-inset-top, 0px));
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-100 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950">
    <!-- Message Display Div -->
    <div id="messageDisplay" style="display: none;"></div>

    <header id="appHeader" class="sticky top-0 z-50 h-12 md:h-16 bg-white/90 dark:bg-slate-950/80 backdrop-blur-sm shadow-md dark:shadow-none dark:border-b dark:border-slate-800 flex items-center justify-between px-4">
        <div class="flex items-center gap-2 md:gap-3 min-w-0">
            <button type="button" id="sidebarMenuButton" class="p-2 -ml-1 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 md:hidden touch-manipulation" onclick="toggleSidebar()" aria-label="Toggle sidebar" aria-controls="appSidebar" aria-expanded="false">
                <svg class="w-6 h-6 text-gray-700 dark:text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
            <a href="dashboard.html" class="text-lg md:text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent shrink-0">HabitTracker</a>
            <span class="hidden sm:inline text-gray-300 dark:text-slate-600">|</span>
            <span class="hidden sm:inline text-base md:text-lg font-semibold text-gray-700 dark:text-gray-200 truncate">Tasks</span>
        </div>
        <div class="flex items-center space-x-2 md:space-x-4 shrink-0">
            <button type="button" id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-200" aria-label="Toggle dark mode">
                <svg id="themeIconMoon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                <svg id="themeIconSun" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
            </button>
            <button type="button" id="logoutButton" class="px-2 py-1.5 md:px-4 md:py-2 rounded-md bg-gradient-to-r from-blue-600 to-purple-600 text-white text-xs md:text-base hover:from-blue-700 hover:to-purple-700 transition-colors shadow-sm">Logout</button>
        </div>
    </header>
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/40 z-30 hidden md:hidden" onclick="toggleSidebar(false)"></div>
    <aside id="appSidebar" class="fixed left-0 bottom-0 z-40 bg-white dark:bg-slate-900 border-r border-gray-200 dark:border-slate-700 flex flex-col transform -translate-x-full md:translate-x-0">
        <button type="button" id="sidebarEdgeToggle" onclick="toggleSidebar()" aria-label="Collapse sidebar" class="hidden md:flex items-center justify-center absolute -right-4 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-600 shadow-md text-gray-500 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:border-blue-300 dark:hover:border-blue-400 transition-colors z-10">
            <svg id="sidebarEdgeIcon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" /></svg>
        </button>
        <nav class="flex-1 p-2 space-y-1">
            <a href="dashboard.html" title="Dashboard" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-slate-800">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                <span class="sidebar-label">Dashboard</span>
            </a>
            <a href="schedule.html" title="Schedule" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-slate-800">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
                <span class="sidebar-label">Schedule</span>
            </a>
            <a href="calendar.html" title="Tasks" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-50 text-blue-700 font-medium dark:bg-blue-950 dark:text-blue-300">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <span class="sidebar-label">Tasks</span>
            </a>
            <a href="progress.html" title="Progress" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-slate-800">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                <span class="sidebar-label">Progress</span>
            </a>
        </nav>
    </aside>

    <div id="appMain" class="content-wrapper">

        <!-- Calendar Content -->
        <div class="max-w-5xl mx-auto px-4 py-8 w-full">
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-3 sm:p-8 md:p-10">
                <div class="flex items-center justify-center gap-2 sm:gap-4 mb-4 sm:mb-8">
                    <button id="prevMonth" class="w-10 h-10 md:w-11 md:h-11 shrink-0 flex items-center justify-center bg-gray-50 dark:bg-slate-700 rounded-full hover:bg-blue-50 dark:hover:bg-slate-600 text-gray-600 dark:text-gray-300 hover:text-blue-600 transition-all">&larr;</button>
                    <h1 id="currentMonthYear" class="text-lg sm:text-3xl font-bold text-center text-gray-900 dark:text-gray-100 min-w-0 sm:min-w-[14rem]">February 2025</h1>
                    <button id="nextMonth" class="w-10 h-10 md:w-11 md:h-11 shrink-0 flex items-center justify-center bg-gray-50 dark:bg-slate-700 rounded-full hover:bg-blue-50 dark:hover:bg-slate-600 text-gray-600 dark:text-gray-300 hover:text-blue-600 transition-all">&rarr;</button>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-3 md:gap-4">
                    <!-- Days will be dynamically generated here -->
                </div>
                <div class="flex flex-wrap items-center justify-center gap-4 sm:gap-6 mt-6 text-xs sm:text-sm text-gray-600 dark:text-gray-400">
                    <span class="inline-flex items-center gap-2"><span class="w-6 h-1.5 rounded-full bg-gray-300"></span> None</span>
                    <span class="inline-flex items-center gap-2"><span class="w-6 h-1.5 rounded-full bg-blue-500"></span> Partial</span>
                    <span class="inline-flex items-center gap-2"><span class="w-6 h-1.5 rounded-full bg-emerald-500"></span> Complete</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Checklist Modal -->
    <div id="modalOverlay" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50" style="display: none;">
        <div id="checklistModal" class="bg-white dark:bg-slate-800 p-4 md:p-6 rounded-2xl shadow-xl w-full max-w-xs sm:max-w-sm md:max-w-md relative mx-4">
            <!-- Close Button -->
            <button id="closeModal" class="absolute top-3 right-3 w-7 h-7 flex items-center justify-center rounded-full text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 hover:text-gray-800 dark:hover:text-white text-xl">&times;</button>
    
            <h2 id="modalTitle" class="text-lg md:text-xl font-bold text-gray-900 dark:text-gray-100 mb-4 pr-8">Checklist</h2>
            <div class="tasks-container">
                <ul id="checklistList" class="divide-y divide-gray-100 dark:divide-slate-700"></ul>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer id="appFooter" class="bg-white/60 dark:bg-slate-900/60 border-t border-gray-200 dark:border-slate-700 py-2.5 md:py-5 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-sm md:text-base text-gray-500 dark:text-gray-400">&copy; 2025 HabitTracker. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript for Dynamic Calendar and Checklist -->
    <script>
        function isDarkTheme() {
            return document.documentElement.classList.contains('dark');
        }
        function syncThemeToggle() {
            const dark = isDarkTheme();
            const sun = document.getElementById('themeIconSun');
            const moon = document.getElementById('themeIconMoon');
            if (sun) sun.classList.toggle('hidden', !dark);
            if (moon) moon.classList.toggle('hidden', dark);
            const btn = document.getElementById('themeToggle');
            if (btn) btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDarkTheme() ? 'dark' : 'light');
            syncThemeToggle();
            window.dispatchEvent(new Event('themechange'));
        }
        syncThemeToggle();
        function isMobileNav() {
            return window.innerWidth < 768;
        }
        function toggleSidebar(open) {
            const sidebar = document.getElementById('appSidebar');
            const edgeBtn = document.getElementById('sidebarEdgeToggle');
            const overlay = document.getElementById('sidebarOverlay');
            const main = document.getElementById('appMain');
            const footer = document.getElementById('appFooter');
            const menuBtn = document.getElementById('sidebarMenuButton');
            const mobile = isMobileNav();
            if (typeof open !== 'boolean') {
                open = mobile ? sidebar.classList.contains('-translate-x-full') : sidebar.classList.contains('collapsed');
            }
            if (mobile) {
                sidebar.classList.remove('collapsed');
                sidebar.classList.toggle('-translate-x-full', !open);
                overlay.classList.toggle('hidden', !open);
                if (main) main.classList.remove('rail');
                if (footer) footer.classList.remove('rail');
                if (menuBtn) menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
            } else {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.toggle('collapsed', !open);
                overlay.classList.add('hidden');
                if (main) main.classList.toggle('rail', !open);
                if (footer) footer.classList.toggle('rail', !open);
                localStorage.setItem('sidebarOpen', open ? '1' : '0');
                if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
            if (edgeBtn) {
                const isExpanded = !sidebar.classList.contains('collapsed');
                edgeBtn.setAttribute('aria-label', isExpanded ? 'Collapse sidebar' : 'Expand sidebar');
            }
            }
        }
        (function initSidebar() {
            if (isMobileNav()) toggleSidebar(false);
            else toggleSidebar(localStorage.getItem('sidebarOpen') !== '0');
        })();

        const token = localStorage.getItem('token');
        document.getElementById('logoutButton').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                window.location.href = '../index.html';
            }
        });
        let currentDate = new Date();
        const calendarGrid = document.getElementById('calendarGrid');
        const currentMonthYear = document.getElementById('currentMonthYear');
        const modalOverlay = document.getElementById("modalOverlay");
        const checklistModal = document.getElementById("checklistModal");
        const closeModal = document.getElementById("closeModal");
        const modalTitle = document.getElementById("modalTitle");
        const checklistList = document.getElementById("checklistList");
        let calendarTasks = [];

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDateKey(year, monthIndex, day) {
            return `${String(day).padStart(2, '0')}-${String(monthIndex + 1).padStart(2, '0')}-${year}`;
        }

        function isCompletedOn(task, dateKey) {
            return !!(task.completed && task.completed[dateKey]);
        }

        function dayDotClass(year, monthIndex, day) {
            if (!calendarTasks.length) return 'bg-transparent';
            const key = formatDateKey(year, monthIndex, day);
            const done = calendarTasks.filter((t) => isCompletedOn(t, key)).length;
            const total = calendarTasks.length;
            if (done === 0) return 'bg-gray-300';
            if (done === total) return 'bg-emerald-500';
            return 'bg-blue-500';
        }

        // Function to show message on screen 
        function showMessage(message) {
            const messageDiv = document.getElementById('messageDisplay');
            messageDiv.innerText = message;
            messageDiv.style.display = 'block';
            messageDiv.style.position = 'fixed';
            messageDiv.style.top = '10px';
            messageDiv.style.left = '50%';
            messageDiv.style.transform = 'translateX(-50%)';
            messageDiv.style.padding = '10px';
            messageDiv.style.background = '#f0f0f0';
            messageDiv.style.border = '1px solid #ccc';
            messageDiv.style.zIndex = '999';
            
            // Hide the message after 3 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // Helper function to format time in AM/PM
        function formatTime(time) {
            if (!time) return ""; // Handle empty time
            const [hours, minutes] = time.split(":");
            let formattedHours = parseInt(hours, 10);
            const ampm = formattedHours >= 12 ? "PM" : "AM";
            formattedHours = formattedHours % 12 || 12; // Convert 0 to 12
            return `${formattedHours}:${minutes} ${ampm}`;
        }
        
        // Helper function to format time display with start and end times
        function formatTimeDisplay(startTime, endTime) {
            if (!startTime) return "";
            
            const formattedStart = formatTime(startTime);
            
            if (endTime) {
                const formattedEnd = formatTime(endTime);
                return `${formattedStart}-${formattedEnd}`;
            }
            
            return formattedStart;
        }

        // Function to render the calendar
        function renderCalendar() {
            calendarGrid.innerHTML = ''; // Clear the grid

            const monthNames = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            currentMonthYear.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const today = new Date();
            const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();

            const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayHeaders.forEach(day => {
                const header = document.createElement('div');
                header.className = 'text-center font-semibold text-xs sm:text-sm text-gray-600 dark:text-gray-400 py-2';
                header.textContent = day;
                calendarGrid.appendChild(header);
            });

            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'aspect-square';
                calendarGrid.appendChild(emptyDay);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const isToday = isCurrentMonth && i === today.getDate();
                const isFuture = new Date(year, month, i) > new Date(today.getFullYear(), today.getMonth(), today.getDate());
                const dayBox = document.createElement('div');
                dayBox.className = isToday
                    ? 'aspect-square sm:aspect-auto sm:min-h-[4.75rem] md:min-h-[5.5rem] flex flex-col items-center justify-center border-2 border-blue-500 rounded-xl shadow-sm bg-blue-50 dark:bg-blue-950 ring-2 ring-blue-200 dark:ring-blue-800 hover:shadow-md transition-shadow'
                    : 'aspect-square sm:aspect-auto sm:min-h-[4.75rem] md:min-h-[5.5rem] flex flex-col items-center justify-center border border-gray-200 dark:border-slate-600 rounded-xl bg-gray-50 dark:bg-slate-900 hover:shadow-md hover:border-purple-200 dark:hover:border-purple-400 transition-shadow';

                let dayButton = document.createElement("button");
                const dotClass = isFuture ? 'bg-transparent' : dayDotClass(year, month, i);
                dayButton.innerHTML = `
                    <span class="font-semibold text-sm sm:text-base md:text-lg ${isToday ? 'text-blue-700 dark:text-blue-300' : 'text-gray-800 dark:text-gray-100'}">${i}</span>
                    <span class="mt-1 sm:mt-1.5 h-1.5 w-5 sm:w-6 rounded-full ${dotClass}"></span>
                `;
                dayButton.className = "w-full h-full flex flex-col items-center justify-center rounded-xl py-1";
                dayButton.onclick = function () {
                    openChecklist(i);
                };

                dayBox.appendChild(dayButton);
                calendarGrid.appendChild(dayBox);
            }
        }

        async function openChecklist(day) {
            const selectedDate = formatDateKey(currentDate.getFullYear(), currentDate.getMonth(), day);
            const titleDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), day);
            modalTitle.textContent = titleDate.toLocaleDateString(undefined, {
                weekday: 'long',
                month: 'short',
                day: 'numeric',
            });
            checklistList.innerHTML = "";

            try {
                if (!calendarTasks.length) {
                    await loadCalendarTasks();
                }

                const tasks = [...calendarTasks];
                const hasOrder = tasks.some((t) => typeof t.order === 'number');
                tasks.sort((a, b) => {
                    if (hasOrder) {
                        const ao = typeof a.order === 'number' ? a.order : Number.MAX_SAFE_INTEGER;
                        const bo = typeof b.order === 'number' ? b.order : Number.MAX_SAFE_INTEGER;
                        if (ao !== bo) return ao - bo;
                    }
                    return (a.time || '').localeCompare(b.time || '');
                });

                if (tasks.length === 0) {
                    const taskItem = document.createElement("li");
                    taskItem.className = "py-3 text-gray-600 dark:text-gray-400";
                    taskItem.innerHTML = 'No tasks yet. Add some on the <a href="schedule.html" class="text-blue-600 dark:text-blue-400 font-medium underline">Schedule</a> page.';
                    checklistList.appendChild(taskItem);
                } else {
                tasks.forEach(task => {
                    const isCompleted = isCompletedOn(task, selectedDate);
                    const taskItem = document.createElement("li");
                    taskItem.className = "py-3 flex items-center gap-3";
                    taskItem.innerHTML = `
                        <input type="checkbox" class="h-5 w-5 rounded text-blue-600 focus:ring-blue-500 flex-shrink-0"
                            ${isCompleted ? 'checked' : ''} data-task-id="${escapeHtml(task._id)}">
                        <span class="min-w-0 flex-1 text-sm md:text-base text-gray-800 dark:text-gray-100 ${isCompleted ? 'line-through text-gray-400' : ''}">${escapeHtml(task.name)}</span>
                        <span class="text-sm text-gray-500 whitespace-nowrap">${escapeHtml(formatTimeDisplay(task.time, task.endTime))}</span>
                    `;
                    checklistList.appendChild(taskItem);

                    const checkbox = taskItem.querySelector('input[type="checkbox"]');
                    const nameEl = taskItem.querySelector('span.min-w-0');
                    checkbox.addEventListener('change', async () => {
                        try {
                            await updateTaskCompletionStatus(task._id, checkbox.checked, selectedDate);
                            if (!task.completed) task.completed = {};
                            task.completed[selectedDate] = checkbox.checked;
                            nameEl.classList.toggle('line-through', checkbox.checked);
                            nameEl.classList.toggle('text-gray-400', checkbox.checked);
                            renderCalendar();
                        } catch (err) {
                            console.error('Error updating completion status:', err);
                            checkbox.checked = !checkbox.checked;
                            showMessage('Failed to update task completion status. Please try again.');
                        }
                    });
                });
                }
            } catch (err) {
                console.error('Error fetching tasks:', err);
                const taskItem = document.createElement("li");
                taskItem.className = "py-3 text-red-500";
                taskItem.textContent = "Failed to load tasks.";
                checklistList.appendChild(taskItem);
                showMessage('Failed to load tasks. Please try again.');
            }

            modalOverlay.style.display = "flex";
        }

        async function loadCalendarTasks() {
            const response = await fetch('/api/tasks', {
                headers: { 'Authorization': token },
            });
            if (!response.ok) throw new Error('Failed to fetch tasks');
            calendarTasks = await response.json();
        }

        // Function to update task completion status
        async function updateTaskCompletionStatus(taskId, completed, date) {
            try {
                const response = await fetch(`/api/tasks/${taskId}/complete`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token, 
                    },
                    body: JSON.stringify({ completed, date }),
                });

                if (!response.ok) {
                    throw new Error('Failed to update task completion status');
                }

                const updatedTask = await response.json();
                console.log('Task completion status updated:', updatedTask);
                // Removed the showMessage call here to prevent completion notification
            } catch (err) {
                console.error('Error updating task completion status:', err);
                showMessage('Failed to update task completion status. Please try again.');
                throw err; // Re-throw to allow checkbox to be reverted
            }
        }

        // Close Modal
        closeModal.addEventListener("click", () => {
            modalOverlay.style.display = "none"; 
        });

        // Close modal when clicking outside
        modalOverlay.addEventListener("click", (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.style.display = "none"; 
            }
        });

        // Event listeners for previous/next month buttons
        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        window.addEventListener('resize', renderCalendar);

        loadCalendarTasks()
            .then(() => renderCalendar())
            .catch((err) => {
                console.error('Error loading tasks:', err);
                renderCalendar();
            });
    </script>
</body>
</html>
