<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Progress - HabitTracker</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html.dark { color-scheme: dark; }
        #appSidebar { top: 4rem; width: 15rem; transition: width 0.2s ease, transform 0.2s ease; }
        #appSidebar.collapsed { width: 4.5rem; }
        #appSidebar.collapsed .sidebar-label { display: none; }
        #appSidebar.collapsed .sidebar-link { justify-content: center; padding-left: 0.5rem; padding-right: 0.5rem; }
        #sidebarEdgeIcon { transition: transform 0.2s ease; }
        #appSidebar.collapsed #sidebarEdgeIcon { transform: rotate(180deg); }
        #appMain, #appFooter { transition: margin-left 0.2s ease; }
        @media (min-width: 768px) {
            #appMain, #appFooter { margin-left: 15rem; }
            #appMain.rail, #appFooter.rail { margin-left: 4.5rem; }
        }
        @media (max-width: 767px) {
            #appSidebar, #appSidebar.collapsed { width: 15rem; }
            #appHeader {
                height: calc(3rem + env(safe-area-inset-top, 0px));
                padding-top: env(safe-area-inset-top, 0px);
                box-sizing: border-box;
            }
            #appSidebar {
                top: calc(3rem + env(safe-area-inset-top, 0px));
            }
        }
    </style>
</head>

    <script>
        function isDarkTheme() {
            return document.documentElement.classList.contains('dark');
        }
        function syncThemeToggle() {
            const dark = isDarkTheme();
            const sun = document.getElementById('themeIconSun');
            const moon = document.getElementById('themeIconMoon');
            if (sun) sun.classList.toggle('hidden', !dark);
            if (moon) moon.classList.toggle('hidden', dark);
            const btn = document.getElementById('themeToggle');
            if (btn) btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDarkTheme() ? 'dark' : 'light');
            syncThemeToggle();
            window.dispatchEvent(new Event('themechange'));
        }
        syncThemeToggle();
        function isMobileNav() {
            return window.innerWidth < 768;
        }
        function toggleSidebar(open) {
            const sidebar = document.getElementById('appSidebar');
            const edgeBtn = document.getElementById('sidebarEdgeToggle');
            const overlay = document.getElementById('sidebarOverlay');
            const main = document.getElementById('appMain');
            const footer = document.getElementById('appFooter');
            const mobile = isMobileNav();
            if (typeof open !== 'boolean') {
                open = mobile ? sidebar.classList.contains('-translate-x-full') : sidebar.classList.contains('collapsed');
            }
            if (mobile) {
                sidebar.classList.remove('collapsed');
                sidebar.classList.toggle('-translate-x-full', !open);
                overlay.classList.toggle('hidden', !open);
                if (main) main.classList.remove('rail');
                if (footer) footer.classList.remove('rail');
            } else {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.toggle('collapsed', !open);
                overlay.classList.add('hidden');
                if (main) main.classList.toggle('rail', !open);
                if (footer) footer.classList.toggle('rail', !open);
                localStorage.setItem('sidebarOpen', open ? '1' : '0');
            }
            if (edgeBtn) {
                const isExpanded = !sidebar.classList.contains('collapsed');
                edgeBtn.setAttribute('aria-label', isExpanded ? 'Collapse sidebar' : 'Expand sidebar');
            }
        }
        (function initSidebar() {
            if (isMobileNav()) toggleSidebar(false);
            else toggleSidebar(localStorage.getItem('sidebarOpen') !== '0');
        })();
        document.getElementById('logoutButton').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                window.location.href = '../index.html';
            }
        });

        // Fetch completion rates function
        async function fetchCompletionRates(startDate, endDate) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/completion-rates?startDate=${startDate}&endDate=${endDate}`, {
                    headers: {
                        'Authorization': token
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to fetch completion rates');
                }
                
                const data = await response.json();
                console.log('Fetched completion data:', data);
                return data;
            } catch (err) {
                console.error('Error fetching completion rates:', err);
                return null;
            }
        }

        // Monthly Progress Chart with improved responsiveness
        const monthlyProgressChart = new Chart(document.getElementById('monthlyProgressChart'), {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Weekly Completion %',
                    data: [],
                    backgroundColor: 'rgba(59, 130, 246, 0.5)',
                    borderColor: 'rgba(59, 130, 246, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        title: {
                            display: true,
                            text: 'Completion %',
                            font: {
                                size: function() {
                                    return window.innerWidth < 768 ? 10 : 12;
                                }
                            }
                        },
                        ticks: {
                            font: {
                                size: function() {
                                    return window.innerWidth < 768 ? 10 : 12;
                                }
                            }
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Weeks of the Month',
                            font: {
                                size: function() {
                                    return window.innerWidth < 768 ? 10 : 12;
                                }
                            }
                        },
                        ticks: {
                            font: {
                                size: function() {
                                    return window.innerWidth < 768 ? 8 : 10;
                                }
                            },
                            maxRotation: 45,
                            minRotation: 0,
                            callback: function(value, index, values) {
                                // Shorten labels on small screens
                                const label = this.getLabelForValue(value);
                                if (window.innerWidth < 480) {
                                    // For very small screens, show just week number
                                    return label.split(':')[0];
                                } else if (window.innerWidth < 768) {
                                    // For medium small screens, show abbreviated version
                                    const parts = label.split(':');
                                    const dates = parts[1].trim().split(' ');
                                    return `${parts[0]}: ${dates[0]}-${dates[1]}`;
                                }
                                return label;
                            }
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        labels: {
                            font: {
                                size: function() {
                                    return window.innerWidth < 768 ? 10 : 12;
                                }
                            }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            title: function(tooltipItems) {
                                return tooltipItems[0].label;
                            },
                            label: function(context) {
                                return `Completion: ${context.raw.toFixed(1)}%`;
                            }
                        }
                    }
                }
            }
        });

        function applyChartTheme() {
            const dark = document.documentElement.classList.contains('dark');
            const tick = dark ? '#cbd5e1' : '#4b5563';
            const title = dark ? '#e2e8f0' : '#111827';
            const grid = dark ? 'rgba(148, 163, 184, 0.2)' : 'rgba(0, 0, 0, 0.1)';
            monthlyProgressChart.options.scales.x.ticks.color = tick;
            monthlyProgressChart.options.scales.y.ticks.color = tick;
            monthlyProgressChart.options.scales.x.title.color = title;
            monthlyProgressChart.options.scales.y.title.color = title;
            monthlyProgressChart.options.scales.x.grid = { color: grid };
            monthlyProgressChart.options.scales.y.grid = { color: grid };
            monthlyProgressChart.options.plugins.legend.labels.color = title;
            monthlyProgressChart.update();
        }
        applyChartTheme();
        window.addEventListener('themechange', applyChartTheme);

        // Shared variables
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        let today = new Date();
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth();
        
        // Set to the first day of the current month
        let currentMonthStart = new Date(currentYear, currentMonth, 1);
        
        // DOM Elements
        const heatmap = document.getElementById('heatmap');
        const monthLabel = document.getElementById('monthLabel');
        const yearLabel = document.getElementById('yearLabel');
        const prevMonthButton = document.getElementById('prevMonth');
        const nextMonthButton = document.getElementById('nextMonth');
        const prevYearButton = document.getElementById('prevYear');
        const nextYearButton = document.getElementById('nextYear');

        // Helper function to format date as YYYY-MM-DD
        function formatDateForAPI(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        // Helper function to format date as DD-MM-YYYY (for API response keys)
        function formatDateKey(date) {
            return `${String(date.getDate()).padStart(2, '0')}-${String(date.getMonth() + 1).padStart(2, '0')}-${date.getFullYear()}`;
        }

        // Helper function to get week number within the month
        function getWeekOfMonth(date) {
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
            const firstWeekday = firstDay.getDay();
            const offsetDate = date.getDate() + firstWeekday - 1;
            return Math.floor(offsetDate / 7) + 1;
        }

        function getHeatmapColor(value, isFuture) {
            if (isFuture) return 'bg-gray-50 border border-gray-100 dark:bg-slate-900 dark:border-slate-700';
            if (value === 0) return 'bg-gray-200 dark:bg-slate-700';
            if (value <= 25) return 'bg-blue-100 dark:bg-blue-900';
            if (value <= 50) return 'bg-blue-300 dark:bg-blue-700';
            if (value <= 75) return 'bg-blue-500';
            return 'bg-blue-700 text-white';
        }

        // Function to update the monthly chart showing weekly data with fixed week ranges
        async function updateMonthlyChart(monthStart) {
            // Calculate the end of the month
            const monthEnd = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 0);
            
            const startDate = formatDateForAPI(monthStart);
            const endDate = formatDateForAPI(monthEnd);
            
            console.log('Fetching monthly data for:', startDate, 'to', endDate);
            
            const authToken = localStorage.getItem('token');
            const [completionData, tasksResponse] = await Promise.all([
                fetchCompletionRates(startDate, endDate),
                fetch('/api/tasks', { headers: { 'Authorization': authToken } }),
            ]);
            const tasks = tasksResponse && tasksResponse.ok ? await tasksResponse.json() : [];
            
            if (completionData) {
                // Define fixed week ranges
                const fixedWeeks = {
                    1: { start: 1, end: 7, totalCompletion: 0, daysCount: 0 },
                    2: { start: 8, end: 14, totalCompletion: 0, daysCount: 0 },
                    3: { start: 15, end: 21, totalCompletion: 0, daysCount: 0 },
                    4: { start: 22, end: 28, totalCompletion: 0, daysCount: 0 },
                    5: { start: 29, end: 31, totalCompletion: 0, daysCount: 0 } // Remaining days
                };
                
                const weekLabels = [];
                const weeklyData = [];
                
                // Populate data for each day in the month
                for (let day = 1; day <= monthEnd.getDate(); day++) {
                    const currentDate = new Date(monthStart.getFullYear(), monthStart.getMonth(), day);
                    const dateKey = formatDateKey(currentDate);
                    
                    // Determine which fixed week this day belongs to
                    let weekNum;
                    if (day <= 7) weekNum = 1;
                    else if (day <= 14) weekNum = 2;
                    else if (day <= 21) weekNum = 3;
                    else if (day <= 28) weekNum = 4;
                    else weekNum = 5;
                    
                    // Add completion data
                    const completionRate = completionData[dateKey] || 0;
                    fixedWeeks[weekNum].totalCompletion += completionRate;
                    fixedWeeks[weekNum].daysCount++;
                }
                
                // Calculate averages and prepare chart data
                for (let weekNum = 1; weekNum <= 5; weekNum++) {
                    const week = fixedWeeks[weekNum];
                    
                    // Skip weeks that don't have any days 
                    if (week.daysCount === 0) continue;
                    
                    const avgCompletion = week.totalCompletion / week.daysCount;
                    
                    // Get the actual end day 
                    const actualEnd = weekNum === 5 ? monthEnd.getDate() : Math.min(week.end, monthEnd.getDate());
                    
                    // Format the week label
                    const weekLabel = `Week ${weekNum}: ${week.start}-${actualEnd} ${monthNames[monthStart.getMonth()]}`;
                    
                    weekLabels.push(weekLabel);
                    weeklyData.push(avgCompletion);
                }

                monthlyProgressChart.data.labels = weekLabels;
                monthlyProgressChart.data.datasets[0].data = weeklyData;
                monthlyProgressChart.update();
                monthLabel.textContent = `${monthNames[monthStart.getMonth()]} ${monthStart.getFullYear()}`;

                const today = new Date();
                today.setHours(0, 0, 0, 0);
                let possible = 0;
                let completed = 0;
                for (let day = 1; day <= monthEnd.getDate(); day++) {
                    const d = new Date(monthStart.getFullYear(), monthStart.getMonth(), day);
                    if (d > today) break;
                    const dateKey = formatDateKey(d);
                    possible += tasks.length;
                    completed += tasks.filter((t) => t.completed && t.completed[dateKey]).length;
                }
                const monthAvgEl = document.getElementById('monthAvg');
                if (monthAvgEl) {
                    if (!possible) {
                        monthAvgEl.textContent = 'No tasks this month';
                    } else {
                        const pct = Math.round((completed / possible) * 100);
                        monthAvgEl.textContent = `${completed} / ${possible} completed this month (${pct}%)`;
                    }
                }
            }
        }

        // Function to render the yearly heatmap
        async function renderYearlyHeatmap(year) {
            const startDate = `${year}-01-01`;
            const endDate = `${year}-12-31`;
            
            console.log('Fetching yearly data for:', startDate, 'to', endDate);
            
            const authToken = localStorage.getItem('token');
            const [completionData, tasksResponse] = await Promise.all([
                fetchCompletionRates(startDate, endDate),
                fetch('/api/tasks', { headers: { 'Authorization': authToken } }),
            ]);
            const tasks = tasksResponse && tasksResponse.ok ? await tasksResponse.json() : [];
            
            if (completionData) {
                heatmap.innerHTML = "";
                
                const existingLegend = document.querySelector('.heatmap-legend');
                if (existingLegend) {
                    existingLegend.remove();
                }
                
                // Create a container for the entire heatmap with labels dark:text-gray-400
                const heatmapContainer = document.createElement('div');
                heatmapContainer.className = 'flex';

                const labelColumn = document.createElement('div');
                labelColumn.className = 'flex flex-col w-12 flex-shrink-0 gap-1';

                const gridContainer = document.createElement('div');
                gridContainer.className = 'flex flex-col gap-1';

                const today = new Date();
                today.setHours(0, 0, 0, 0);

                for (let month = 0; month < 12; month++) {
                    const daysInMonth = new Date(year, month + 1, 0).getDate();

                    const monthLabelEl = document.createElement('div');
                    monthLabelEl.className = 'h-8 flex items-center text-xs font-medium text-gray-600';
                    monthLabelEl.textContent = monthNames[month];
                    labelColumn.appendChild(monthLabelEl);

                    const monthRow = document.createElement('div');
                    monthRow.className = 'flex gap-1 h-8';

                    for (let day = 1; day <= daysInMonth; day++) {
                        const cell = document.createElement('div');
                        const dateKey = `${String(day).padStart(2, '0')}-${String(month + 1).padStart(2, '0')}-${year}`;
                        const cellDate = new Date(year, month, day);
                        const isFuture = cellDate > today;
                        const completionRate = completionData[dateKey] || 0;

                        cell.className = `w-8 h-8 flex-shrink-0 rounded-md ${getHeatmapColor(completionRate, isFuture)} hover:ring-2 hover:ring-blue-400 hover:ring-offset-1 dark:hover:ring-offset-slate-800 transition-all duration-200`;
                        cell.title = isFuture
                            ? `${monthNames[month]} ${day}, ${year}: upcoming`
                            : `${monthNames[month]} ${day}, ${year}: ${completionRate.toFixed(1)}%`;
                        monthRow.appendChild(cell);
                    }

                    gridContainer.appendChild(monthRow);
                }

                heatmapContainer.appendChild(labelColumn);
                heatmapContainer.appendChild(gridContainer);
                heatmap.appendChild(heatmapContainer);

                const legend = document.createElement('div');
                legend.className = 'mt-4 flex flex-wrap items-center justify-center gap-2 md:gap-4 heatmap-legend';

                const legendItems = [
                    { label: 'Upcoming', color: 'bg-gray-50 border border-gray-200 dark:bg-slate-900 dark:border-slate-700' },
                    { label: '0%', color: 'bg-gray-200 dark:bg-slate-700' },
                    { label: '1-25%', color: 'bg-blue-100 dark:bg-blue-900' },
                    { label: '26-50%', color: 'bg-blue-300 dark:bg-blue-700' },
                    { label: '51-75%', color: 'bg-blue-500' },
                    { label: '76-100%', color: 'bg-blue-700' }
                ];

                legendItems.forEach(item => {
                    const legendItem = document.createElement('div');
                    legendItem.className = 'flex items-center gap-1';

                    const colorBox = document.createElement('div');
                    colorBox.className = `w-4 h-4 flex-shrink-0 ${item.color} rounded-sm`;

                    const label = document.createElement('span');
                    label.className = 'text-xs text-gray-600 dark:text-gray-400';
                    label.textContent = item.label;

                    legendItem.appendChild(colorBox);
                    legendItem.appendChild(label);
                    legend.appendChild(legendItem);
                });

                const container = heatmap.parentElement;
                container.appendChild(legend);

                let possible = 0;
                let completed = 0;
                for (let month = 0; month < 12; month++) {
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    for (let day = 1; day <= daysInMonth; day++) {
                        const d = new Date(year, month, day);
                        if (d > today) break;
                        const dateKey = `${String(day).padStart(2, '0')}-${String(month + 1).padStart(2, '0')}-${year}`;
                        possible += tasks.length;
                        completed += tasks.filter((t) => t.completed && t.completed[dateKey]).length;
                    }
                }
                const yearAvgEl = document.getElementById('yearAvg');
                if (yearAvgEl) {
                    if (!possible) {
                        yearAvgEl.textContent = 'No tasks this year';
                    } else {
                        const pct = Math.round((completed / possible) * 100);
                        yearAvgEl.textContent = `${completed} / ${possible} completed this year (${pct}%)`;
                    }
                }
            }

            yearLabel.textContent = String(year);
        }

        // Event listeners for month navigation
        prevMonthButton.addEventListener('click', () => {
            currentMonthStart.setMonth(currentMonthStart.getMonth() - 1);
            updateMonthlyChart(currentMonthStart);
        });

        nextMonthButton.addEventListener('click', () => {
            currentMonthStart.setMonth(currentMonthStart.getMonth() + 1);
            updateMonthlyChart(currentMonthStart);
        });

        // Event listeners for year navigation
        prevYearButton.addEventListener('click', () => {
            currentYear--;
            renderYearlyHeatmap(currentYear);
        });

        nextYearButton.addEventListener('click', () => {
            currentYear++;
            renderYearlyHeatmap(currentYear);
        });

        // Handle window resize events to redraw the chart with appropriate font sizes
        window.addEventListener('resize', () => {
            monthlyProgressChart.update();
        });

        // Initial render
        updateMonthlyChart(currentMonthStart);
        renderYearlyHeatmap(currentYear);
    </script>
</body>
</html>
