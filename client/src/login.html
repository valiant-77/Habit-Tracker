<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - HabitTracker</title>
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        html.dark { color-scheme: dark; }
        html, body { overflow-x: hidden; }
        #appNav {
            padding-top: env(safe-area-inset-top, 0px);
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
          -webkit-box-shadow: 0 0 0px 1000px white inset;
          transition: background-color 5000s ease-in-out 0s;
          -webkit-text-fill-color: black;
        }
        
        
        input:autofill {
          background-color: white;
          color: black;
        }
        html.dark input:-webkit-autofill,
        html.dark input:-webkit-autofill:hover,
        html.dark input:-webkit-autofill:focus {
          -webkit-box-shadow: 0 0 0px 1000px #1e293b inset;
          -webkit-text-fill-color: #f1f5f9;
        }
        html.dark input:autofill {
          background-color: #1e293b;
          color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-100 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950 min-h-screen min-h-[100dvh] flex flex-col">
    <!-- Navbar -->
    <nav id="appNav" class="bg-white/90 dark:bg-slate-950/80 backdrop-blur-sm shadow-md dark:shadow-none dark:border-b dark:border-slate-800 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-12 md:h-16">
                <div class="flex items-center">
                    <a href="./index.html" class="text-lg md:text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">HabitTracker</a>
                </div>
                <div class="flex items-center space-x-2 md:space-x-4">
                    <button type="button" id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-200" aria-label="Toggle dark mode">
                        <svg id="themeIconMoon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                        <svg id="themeIconSun" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    </button>
                    <a href="./index.html" class="px-2 py-1.5 md:px-4 md:py-2 rounded-md bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-200 text-xs md:text-base hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
                        <span class="sm:hidden">Home</span><span class="hidden sm:inline">Back to Home</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Login Form - Flex grow to push footer down -->
    <div class="flex-grow flex items-center justify-center px-3 sm:px-4 py-6 md:py-8">
        <div class="bg-white dark:bg-slate-800 p-4 sm:p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-md min-w-0 border border-white/60 dark:border-slate-700">
            <div class="flex justify-center mb-4">
                <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-7 sm:w-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
            </div>
            <h2 class="text-xl sm:text-2xl font-bold text-center mb-4 sm:mb-6 text-gray-900 dark:text-gray-100">Welcome Back!</h2>
            
            <!-- Message Display Area -->
            <div id="messageDisplay" class="hidden text-center mb-4 px-1 text-sm break-words"></div>
            
            <form id="loginForm">
                <!-- Username Input -->
                <div class="mb-4">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        autocapitalize="none"
                        autocorrect="off"
                        spellcheck="false"
                        class="w-full min-h-[44px] text-base px-3 py-2.5 border border-gray-300 dark:border-slate-600 dark:bg-slate-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors"
                        placeholder="Enter your username"
                        required
                    />
                </div>

                <!-- Password Input -->
                <div class="mb-4">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="password">Password</label>
                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            class="w-full min-h-[44px] text-base px-3 py-2.5 pr-12 border border-gray-300 dark:border-slate-600 dark:bg-slate-900 dark:text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-colors"
                            placeholder="Enter your password"
                            required
                        />
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-gray-500 hover:text-purple-600 transition-colors touch-manipulation"
                            aria-label="Show password"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <label for="rememberMe" class="mb-4 flex items-center gap-3 min-h-[44px] cursor-pointer">
                    <input
                        type="checkbox"
                        id="rememberMe"
                        class="h-5 w-5 text-purple-600 border-gray-300 rounded focus:ring-purple-500"
                    />
                    <span class="text-sm text-gray-700 dark:text-gray-300">Remember Me</span>
                </label>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full min-h-[44px] bg-gradient-to-r from-blue-600 to-purple-600 text-white py-2.5 rounded-lg hover:from-blue-700 hover:to-purple-700 shadow-md hover:shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 touch-manipulation"
                >
                    Login
                </button>

                <!-- Signup Link -->
                <p class="text-center mt-4 text-sm sm:text-base text-gray-600 dark:text-gray-400">
                    Don't have an account? 
                    <a href="./signup.html" class="text-purple-600 font-medium hover:underline inline-block py-1 touch-manipulation">Sign up</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white/60 dark:bg-slate-900/60 border-t border-gray-200 dark:border-slate-700 py-2.5 md:py-5 mt-auto pb-[max(0.625rem,env(safe-area-inset-bottom))]">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-sm md:text-base text-gray-500 dark:text-gray-400">&copy; 2025 HabitTracker. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript for Login Form -->
    <script>
        function isDarkTheme() {
            return document.documentElement.classList.contains('dark');
        }
        function syncThemeToggle() {
            const dark = isDarkTheme();
            const sun = document.getElementById('themeIconSun');
            const moon = document.getElementById('themeIconMoon');
            if (sun) sun.classList.toggle('hidden', !dark);
            if (moon) moon.classList.toggle('hidden', dark);
            const btn = document.getElementById('themeToggle');
            if (btn) btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDarkTheme() ? 'dark' : 'light');
            syncThemeToggle();
        }
        syncThemeToggle();
        function showMessage(message) {
            const messageDisplay = document.getElementById('messageDisplay');
            messageDisplay.textContent = message;
            messageDisplay.classList.remove('hidden');
            messageDisplay.style.display = 'block';
        }
        
        // Password toggle functionality
        const eyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`;
        const eyeOffIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18M10.584 10.587a2 2 0 002.828 2.83M9.363 5.365A9.466 9.466 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411M6.228 6.228A10.025 10.025 0 002.458 12c1.274 4.057 5.064 7 9.542 7a9.46 9.46 0 004.635-1.228" /></svg>`;
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.innerHTML = eyeOffIcon;
                this.setAttribute('aria-label', 'Hide password');
            } else {
                passwordInput.type = 'password';
                this.innerHTML = eyeIcon;
                this.setAttribute('aria-label', 'Show password');
            }
        });
        
        localStorage.removeItem('rememberMePassword');
        const savedUsername = localStorage.getItem('rememberMeUsername');

        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
            document.getElementById('rememberMe').checked = true;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent default form submission

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            try {
                // Send login request to the backend
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Save the JWT token in localStorage
                    localStorage.setItem('token', data.token);

                    if (rememberMe) {
                        localStorage.setItem('rememberMeUsername', username);
                    } else {
                        localStorage.removeItem('rememberMeUsername');
                    }

                    // Show success message and redirect to the dashboard
                    showMessage('Login successful! Redirecting to dashboard...');
                    setTimeout(() => {
                        window.location.href = './Dashboard/dashboard.html';
                    }, 1000); // Redirect after 1 second
                } else {
                    // Display error message
                    showMessage(data.error || 'Login failed. Please try again.');
                }
            } catch (err) {
                console.error('Error:', err);
                showMessage('An error occurred. Please try again.');
            }
        });
    </script>
</body>
</html>
